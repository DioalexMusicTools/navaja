name: DC-23 v1.0 - macOS DMG and Windows EXE

on:
  push:
    branches: ["dc23-v1-release"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-release:
    name: Universal macOS VST3 and DMG installer
    runs-on: macos-15
    timeout-minutes: 65
    env:
      MAC_P12_BASE64: ${{ secrets.DC23_MAC_DEVELOPER_CERT_P12_BASE64 }}
      MAC_P12_PASSWORD: ${{ secrets.DC23_MAC_DEVELOPER_CERT_PASSWORD }}
      MAC_APP_IDENTITY: ${{ secrets.DC23_MAC_APP_SIGNING_IDENTITY }}
      MAC_INSTALLER_IDENTITY: ${{ secrets.DC23_MAC_INSTALLER_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.DC23_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.DC23_APPLE_TEAM_ID }}
      NOTARY_APP_PASSWORD: ${{ secrets.DC23_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS universal (arm64 + x86_64)
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compile release VST3 and regression tests
        run: cmake --build build --config Release --target DC23Plugin_VST3 dc23_dsp_tests --parallel 3
      - name: Validate DSP regression
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build PKG and DMG, optionally sign and notarize
        run: bash installer/macos/build-installer.sh
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: DC-23-v1.0-macOS-DMG
          path: |
            dist/DC-23-v1.0-macOS-universal.dmg
            dist/DC-23-v1.0.pkg
          if-no-files-found: error

  windows-release:
    name: Windows x64 VST3 and EXE installer
    runs-on: windows-2022
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.DC23_WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.DC23_WINDOWS_CODESIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Microsoft Visual Studio 2022 x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile release VST3 and regression tests
        run: cmake --build build --config Release --target DC23Plugin_VST3 dc23_dsp_tests --parallel 3
      - name: Validate DSP regression
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Create Windows setup EXE, optionally Authenticode sign
        run: .\installer\windows\build-installer.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DC-23-v1.0-Windows-EXE
          path: dist/DC-23-v1.0-Windows-x64-Setup.exe
          if-no-files-found: error
