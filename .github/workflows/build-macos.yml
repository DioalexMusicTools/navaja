name: DC-23 macOS VST3

on:
  push:
    branches: ["dc23-vst3", "dc23-v2", "dc23-v03", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  macos-vst3:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal binary
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 and DSP tests
        run: cmake --build build --config Release --target DC23Plugin_VST3 dc23_dsp_tests --parallel 3
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate universal Mach-O
        run: |
          PLUGIN="build/DC23Plugin_artefacts/Release/VST3/DC-23.vst3"
          test -d "$PLUGIN"
          BIN="$PLUGIN/Contents/MacOS/DC-23"
          test -f "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64
          file "$BIN"
      - name: Package VST3
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/DC23Plugin_artefacts/Release/VST3/DC-23.vst3 \
            dist/DC-23-macOS-universal-VST3.zip
      - name: Upload compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: DC-23-macOS-universal-VST3
          path: dist/DC-23-macOS-universal-VST3.zip
          if-no-files-found: error
