name: DioCHORD X VST3 - macOS and Windows

on:
  push:
    branches: ["diochord-x-v01"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-universal:
    name: macOS universal VST3
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Apple Silicon and Intel
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compile plugin and harmony tests
        run: cmake --build build --config Release --target DioCHORDXPlugin_VST3 diochord_harmony_tests --parallel 3
      - name: Run original progression engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify both Mac architectures
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find build/DioCHORDXPlugin_artefacts/Release/VST3 -maxdepth 1 -type d -name '*.vst3' -print -quit)"
          test -n "$BUNDLE"
          BIN="$(find "$BUNDLE/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          test -n "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64
          file "$BIN"
      - name: Pack installable VST3 folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE="$(find build/DioCHORDXPlugin_artefacts/Release/VST3 -maxdepth 1 -type d -name '*.vst3' -print -quit)"
          test -n "$BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" \
            dist/DioCHORD-X-macOS-universal-VST3.zip
      - name: Publish macOS plugin
        uses: actions/upload-artifact@v4
        with:
          name: DioCHORD-X-macOS-universal-VST3
          path: dist/DioCHORD-X-macOS-universal-VST3.zip
          if-no-files-found: error

  windows-x64:
    name: Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile plugin and harmony tests
        run: cmake --build build --config Release --target DioCHORDXPlugin_VST3 diochord_harmony_tests --parallel 3
      - name: Run original progression engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Windows x64 VST3
        run: |
          $folder = "build/DioCHORDXPlugin_artefacts/Release/VST3"
          $plugin = Get-ChildItem $folder -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $plugin) { throw "Missing VST3 bundle" }
          $architecture = Join-Path $plugin.FullName "Contents/x86_64-win"
          $binary = Get-ChildItem $architecture -File -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $binary -or $binary.Length -lt 100000) {
            throw "Missing compiled x64 VST3 binary"
          }
          Write-Host "Windows x64 binary: $($binary.FullName)"
      - name: Pack installable VST3 folder
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $plugin = Get-ChildItem "build/DioCHORDXPlugin_artefacts/Release/VST3" -Directory -Filter "*.vst3" | Select-Object -First 1
          if ($null -eq $plugin) { throw "Missing VST3 bundle" }
          Compress-Archive -LiteralPath $plugin.FullName -DestinationPath "dist/DioCHORD-X-Windows-x64-VST3.zip" -CompressionLevel Optimal -Force
      - name: Publish Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: DioCHORD-X-Windows-x64-VST3
          path: dist/DioCHORD-X-Windows-x64-VST3.zip
          if-no-files-found: error
